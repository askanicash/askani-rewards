<!-- Bottom Fixed Banner Container -->
<div id="fixedBottomAd" style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 728px; height: 90px; background: #ffffff; box-shadow: 0 -3px 12px rgba(0,0,0,0.2); z-index: 99999; border-top: 1px solid #dddddd; text-align: center; display: block;">
  
  <!-- Banner Close Button (×) -->
  <span onclick="document.getElementById('fixedBottomAd').style.display='none';" style="position: absolute; right: 5px; top: -28px; background: #222222; color: #ffffff; padding: 3px 12px; font-size: 13px; font-family: Arial, sans-serif; border-radius: 4px 4px 0 0; cursor: pointer; user-select: none; font-weight: bold;">× Close</span>
  
  <!-- Aapka Adsterra Direct Link Iframe -->
  <iframe src="YOUR_DIRECT_LINK" style="border: none; height: 100%; width: 100%; overflow: hidden;" scrolling="no"></iframe>
</div>
