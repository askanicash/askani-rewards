<div id="autoDirectBanner">
  <iframe id="autoAdFrame"
          title="Advertisement">
  </iframe>
</div>

<script>
(function() {
  var links = [
    "https://uplcm.com/4/6523935",
    "https://offerwallmedia.com/ptp/view/1616",
    "https://offerwall.me/ptp/6a67e232c7332792d1e1ded9",
    "https://surfflux.com/p/B4TEBDS9uCBEJLVGkzKCDbhfsrJ6V8Akjqp2fsDjOrc",
    "https://t.co/Dw2W3wEnNQ"
  ];

  var index = 0;
  var frame = document.getElementById("autoAdFrame");

  function rotateAd() {
    frame.src = links[index];
    index = (index + 1) % links.length;
  }

  rotateAd();
  setInterval(rotateAd, 10000);
})();
</script>
